# OysterPilot ルール表（AI Oysterman / Oyscan 共通）
# 閾値はここで管理し、コードにハードコードしない。
# いずれも「厳守」ではなく助言の目安。数理モデルの集計を参考にした丸めた値で、モデル本体・係数は含まない。

meta:
  version: 2026-11-02b   # 高畑聞き取り（knowledge/reblue_views.md）を反映
  water_source: 気象庁「日本沿岸域の海面水温情報」海域 623 周防灘（海域平均・実績値）
  tone:
    - 断定しない。「増えやすい時期です」「目安です」まで
    - 「死にます」「必ず」「予測」は使わない
    - 高水温と斃死は相関として語る

thresholds:
  hot_temp_c: 28          # 高水温の基準
  hot_days: 7             # 連続日数
  cold_temp_c: 10         # 低水温の基準
  cold_days: 7
  growth_band_c: [15, 25] # 成長しやすい水温帯
  growth_check_days: 15   # 成長期に「見てみましょう」を出す経過日数
  sort_interval_days: 30  # 通常の選別目安（2潮）
  sort_interval_cold_multiplier: 1.5   # 低水温期は 30 → 45 日
  basket_kg_normal: 2.0   # 1かご総重量の通常目安（25L かごで容量の 1/4 相当）
  basket_kg_thin: 1.5     # 薄くするとき（高水温期・成長期・身質不良。15L かごの 1/4 相当）
  basket_kg_dense: 2.5    # 揺れを抑えたいとき
  basket_fill_ratio: 0.25 # リブルの目安は「かご容量の 1/4」。容量が分かるときはこちらで言う（15L→約1.5kg、25L→約2.0kg）
  basket_volumes_l: [15, 25]
  mortality_notice_ratio: 0.2     # 前回選別から約30日で斃死 20% 以上なら「多め」
  mortality_notice_weight_g: 30   # 30g 以上の斃死 20% は影響が大きい
  summer_work_mean7_c: 26         # 直近7日平均がこれ以上なら「陸上作業は短く・1日で完結」を添える

rules:
  - id: R1_hot
    when: env.hot_streak >= thresholds.hot_days
    kind: notice          # 相談内容に関係なく一言添える
    say: 高水温が続いています。作業時間を短くして、貝に負担をかけないようにしましょう。
    note: 作業を止めるのではなく「短く・負担をかけずに」。R7 と同時なら「選別しましょう。高水温なので手早く」。
    effects:
      basket_kg_target: thin

  - id: R2_cold
    when: env.cold_streak >= thresholds.cold_days
    kind: notice
    say: 水温が低く、生育が鈍る時期です。選別の間隔は少し空けて様子を見ましょう。
    effects:
      sort_interval_multiplier: 1.5

  - id: R3_growth_check
    when: env.in_growth_band and lot.days_since_last_sort >= thresholds.growth_check_days and lot.days_since_last_sort < effective_sort_interval
    kind: notice
    say: 適水温で、かなり成長しているかもしれません。殻の伸びや詰まり具合を注意して見てみましょう。
    note: 選別は必須にしない。R7 が成立するときは R7 を優先し、R3 は出さない。
    effects:
      basket_kg_target: thin

  - id: R4_basket_target
    when: topic in [選別, 分殖, 入数, 身質]   # 選別・入数の話題が出たときの助言
    kind: advice
    say: 次の選別では、1かご {basket_kg_target}kg を目安に（{avg_weight_g}g なら約 {count_target} 個）。厳守ではなく目安です。
    note: >
      通常 2.0kg。R1/R3 成立中、または身質が悪いと言われたら 1.5kg。
      揺れを抑えたい（殻がツルツル）ときは 2.5kg。超えたことを警告しない。

  - id: R5_shell_long
    when: user says 殻が伸びている / 刃先が伸びた / ひょろ長い
    kind: advice
    ask_first: 上段だけですか？ 下段も同じ様子ですか？
    say: 刃先が伸びる＝揺れが足りていない合図です。揺れの強い場所に移すか、次の選別では入数を薄め（1.5kg目安）にしましょう。
    effects:
      basket_kg_target: thin

  - id: R6_shell_smooth
    when: user says 殻がツルツル / 削られすぎ / 丸くなりすぎ
    kind: advice
    say: 揺れが強すぎる合図です。静穏な場所に移すか、入数を上げて（2.5kg目安）揺れを抑えましょう。
    effects:
      basket_kg_target: dense

  - id: R7_sort_due
    when: lot.days_since_last_sort > effective_sort_interval
    kind: recommend
    say: 前回の選別から {days} 日で、貝をチェックする目安（{effective_sort_interval}日）を過ぎています。殻の形とかごの詰まり具合を見て、必要なら選別しましょう。
    note: >
      effective_sort_interval = sort_interval_days × (R2 成立なら 1.5)。R1 同時なら「高水温なので手早く」を添える。
      30 日は「死ぬ日数」ではなく「貝をチェックする目安」（リブル）。遅れると容量過多で殻が曲がり、過密で餌の食い合いが起きやすい。

  - id: R8_mortality_notice
    when: lot.mortality_ratio >= thresholds.mortality_notice_ratio   # 直近の選別で数えた斃死 ÷（残った個数＋斃死）
    kind: notice
    say: 前回の選別で斃死が {mortality_pct}% と多めでした。原因は一つに決めず、密度・水温・雨量・場所・時期・青潮や赤潮の順に見てみましょう。
    note: >
      30g 以上の貝で 20% 以上なら「小さいサイズの同じ率より影響が大きい」と添える（リブル）。原因は断定しない。
    effects:
      basket_kg_target: thin

  - id: R9_summer_work
    when: env.mean7 >= thresholds.summer_work_mean7_c or env.season == hot
    kind: notice
    say: 暑い時期は陸上の作業を短く、陸揚げ・選別・かご詰め・沖出しを 1 日で完結させましょう。次の日に持ち越さないのが現場の基本です。
    note: 気温 30℃ を超える日は陸上選別の時間をできる限り減らす。空調のない部屋での放置は避ける（リブル）。

  - id: R10_storm
    when: user says 台風 / 大雨 / 時化 / 低気圧
    kind: advice
    say: 台風や大雨の前はラックなら下段に下げておきましょう。通過後はまず塩分の下がり具合と貝の色合いを見て、直後の選別は避けましょう。
    note: 赤潮・青潮は県の水産試験場など水産行政の情報を確認。赤潮には牡蠣にとって良いものもあるので種類を見る（リブル）。

out_of_scope:
  say: この相談はルールの範囲外なので、先輩に聞く項目として整理します。
  action: show_button_consult_expert    # [専門家に相談する]（リブル問い合わせページへ）
  triggers:
    - ルールに該当しない相談（病気・衛生・販売・法規など）
    - ユーザーが「分からない」「解決しない」と言ったとき

oyscan:
  # 全国版（2026-11-03）。データは scripts/fetch_scan_areas.ts がビルド時に作る apps/api/data/scan_areas.json。
  # 集計期間は直近 5 年（データ最終日の年を除く）。閾値は全国 80 海域の分布を見て決めた目安（2026-11-03 高畑確定）。
  heavy_rain_mm: 50                 # 「大雨の日」の基準（日降水量）
  map_pick_radius_km: 150           # クリック地点からこの距離以内に海域の中心点が無ければ「未対応」
  mortality_risk:                   # 斃死リスク 低／中／高 ＝ 高水温日数 × 大雨日数（6〜10 月）
    hot_days_low_max: 10            # 28℃以上の日数（年平均）がこれ以下なら低（0点）、mid_max 以下なら中（1点）、超えたら高（2点）
    hot_days_mid_max: 40
    heavy_days_low_max: 3           # 6〜10 月の 50mm 以上の日数（年平均。最寄り2観測所の加重平均）がこれ以下なら低（0点）
    heavy_days_mid_max: 6           # これ以下なら中（1点）、超えたら高（2点）
    # 総合：2 軸の点数の合計。0〜1 点＝低、2 点＝中、3〜4 点＝高
  growth_speed:                     # 成長スピード 良／普／鈍 ＝ 15〜25℃ の日数と 10℃未満の日数
    growth_days_good_min: 200       # 15〜25℃ の日数（年平均）がこれ以上なら良
    growth_days_slow_max: 120       # これ以下なら鈍
    cold_days_penalty_min: 90       # 10℃未満の日数がこれ以上なら 1 段下げる
  labels:
    mortality_risk: {low: 低, mid: 中, high: 高}
    growth_speed: {good: 良, normal: 普, slow: 鈍}
