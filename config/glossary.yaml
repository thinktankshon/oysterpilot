# 用語集と作業規律（AI Oysterman のシステムプロンプトに注入。Voysy の正規化にも使う）

terms:
  選別: 陸に揚げた貝をサイズで分け、かごに入れ直す作業
  分殖（ぶんしょく）: 1かごの数を減らし、かごを増やすこと（「かご分け」とは言わない）
  入数: 1かごに入れる貝の数
  沖出し: 貝を海に入れること（選別後に戻す場合も含む）
  陸揚げ: 貝を海から揚げること
  沖出し場所: かごを吊ったライン番号や段（例：3番ライン・上段）
  斃死（へいし）: 死んだ貝
  刃先: 殻の縁の、新しく伸びた薄い部分
  揺れ: 波や潮で、かごの中の貝が動くこと。刃先が削られて、殻が丸く深くなる
  身入り／身質: 身の詰まり具合
  一潮（ひとしお）: 大潮から次の大潮まで、約2週間
  3倍体: ほとんど産卵せず、産卵による疲弊が抑えられる種苗（「産卵しない」と言い切らない）
  シングルシード: 貝を1粒ずつばらして、かごで育てる養殖方法
  サイズ選別: 殻の大きさ（ふるいの目合い）で分ける選別。10mm から 10mm 刻みで 40mm まで
  重量選別: 重さで分ける選別。20g 以上から。20g 未満／20〜30g／以降 10g 刻みが目安（強制ではない）
  上段: ラインの上側。よく揺れて干出時間も長く、成長は比較的遅い
  下段: ラインの下側。揺れが弱く、成長は比較的早い
  フリップファーム式: かごを反転させて人為的に干出させる方式。秋冬は日中6時間程度、春夏は早朝に短時間が目安
  ヒラムシ: 貝を食べる扁形動物。現場では大敵。干出にかかることで一定防げる

work_types:            # Voysy の work_type 正規化先
  - 選別
  - 分殖
  - 沖出し
  - 陸揚げ
  - 揺らし
  - 移動
  - その他
lot_format:            # ロット番号の型（Voysy の読み取り・検証に使う）
  pattern: "R{season}-K{n}"       # 例：R8-K3 = 令和8年度の3回目の採苗ロット。R は年度（令和）、K は採苗回数。選別で分けても番号は変わらない
  regex: "^R\\d{1,2}-K\\d{1,2}$"
  current_prefix: R8              # 「K3」とだけ言われたら今季の接頭辞を補う
  examples: [R8-K1, R8-K3, R8-K12]

plausible_ranges:      # 音声の聞き間違い対策。範囲外は null にして「確認」に回す（Voysy の抽出・検証で使う）
  avg_weight_g: [1, 200]        # シングルシードのサイズ。200g 超はあり得ない（30g が 330g になる誤認識など）
  count_per_basket: [1, 300]
  basket_count: [1, 500]
  mortality: [0, 2000]

voice_cues_file: config/voice_cues.json   # 作業セッションの合図語（区切り・終了）。JSON なのは Web と Worker の両方が追加ライブラリなしで読むため

aliases:               # 発話 → 正規化
  かご分け: 分殖
  カゴ分け: 分殖
  分けた: 分殖
  サイズ分け: 選別
  ふるい: 選別
  揺する: 揺らし
  移した: 移動

discipline:            # 作業規律（AI Oysterman が根拠に使う）
  - 選別の目安は2潮（約30日）。牡蠣は潮の周期で動きが出るため。30日は「貝をチェックする目安」で、過ぎた瞬間に死ぬわけではない
  - 選別のときは、サイズ・入数・斃死・かご数・沖出し場所（ライン・段）を記録する。必ず残す順は 斃死数（割合でも可）→ 選別した日 → 重量
  - 入数はかご容量の1/4を目安にする。15Lかごで約1.5kg、25Lかごで約2.0kg。薄くするとき1.5kg、揺れを抑えたいとき2.5kg（目安）
  - 20gまではサイズ選別、20g以上は重量選別に切り替えると出荷までの記録が精緻になる
  - 陸揚げ→選別→かご詰め→沖出しは可能な限り1日で完結させ、次の日に持ち越さない（特に夏）
  - 選別時に口が開きっぱなしの貝は斃死なので除去し、数を記録する。肉が付いたまま死んでいれば数日以内の斃死とメモする
  - 刃先が伸びているなら揺れる漁場へ、殻がツルツルで伸びが欲しいなら揺れの弱い漁場へ（沖側は揺れが強く、陸側は弱い）
  - 種苗の沖出しは6mm目合いにかかる8〜10mm以上が理想。袋メッシュは過密になりやすい
  - 育て始めの1か月は、沖出し時の記録と比べて斃死率と殻高の伸び率を見る
  - 台風・大雨の前はラックを下段へ。通過後は塩分の低下と貝の色合いを見て、直後の選別は避ける
  - 牡蠣の状態に応じた細かなハンドリング（目合いを変えるかなど）は先輩に聞く項目

persona:               # AI Oysterman の話し方
  - 伴走者。斃死の原因は断定せず、複合的な可能性をサジェストとして並べる
  - 隣で教えてくれる先輩。短く、具体的に、理由を一言添える
  - 分からないことは分からないと言う。ルールの外は「先輩に聞く項目」として整理する
  - 数字は記録から引用する（記録にない数字を作らない）
